<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .admin-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: #FFF;
            overflow: hidden;
        }

        .admin-sidebar {
            width: 260px;
            background: #F9F9F8;
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .admin-main {
            flex: 1;
            padding: 48px;
            overflow-y: auto;
            background: #FFFFFF;
        }

        .admin-content-wrapper {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .admin-card {
            background: #F9F9F8;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .admin-card h3 {
            font-size: 16px;
            margin-bottom: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Drag Drop */
        .drag-drop-area {
            background: #FFF;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .drag-drop-area:hover {
            background: #F0F0F0;
        }

        /* Table without borders */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }

        .admin-table th,
        .admin-table td {
            padding: 16px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .admin-table th {
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: none;
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge.ready {
            background: #ECFDF5;
            color: #10B981;
        }

        .badge.proc {
            background: #FEF3C7;
            color: #F59E0B;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="light-theme">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="logo" style="margin-bottom: 40px; font-size: 18px;">
                <i class="ph-bold ph-gauge" style="color: var(--accent-primary);"></i>
                <span style="font-weight: 600;">Admin Panel</span>
            </div>

            <div style="flex: 1;">
                <button class="menu-list-btn"
                    style="background: #EBEBEB; width: 100%; justify-content: flex-start; margin-bottom: 8px;">
                    <i class="ph ph-files"></i> Kelola Dokumen
                </button>
            </div>

            <div class="sidebar-footer"
                style="padding-top: 16px; border-top: 1px solid var(--border-color); margin-top: auto;">
                <div class="user-profile"
                    style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div
                            style="width: 32px; height: 32px; background: var(--accent-primary); color: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px;">
                            A</div>
                        <div style="display: flex; flex-direction: column;">
                            <span
                                style="font-size: 13px; font-weight: 500; color: var(--text-primary);">Administrator</span>
                            <span style="font-size: 11px; color: var(--text-muted);">Admin Panel</span>
                        </div>
                    </div>
                    <button class="icon-btn" id="admin-logout-btn" title="Logout" style="color: #E53E3E;">
                        <i class="ph ph-sign-out"></i>
                    </button>
                </div>
            </div>
        </aside>

        <main class="admin-main">
            <div class="admin-content-wrapper">
                <h2 style="font-size: 24px; margin-bottom: 8px; font-weight: 600;">Dashboard Dokumen</h2>
                <p style="color: var(--text-secondary); margin-bottom: 40px;">Unggah dan pantau dokumen pedoman akademik
                    untuk basis pengetahuan AI.</p>

                <div class="admin-card">
                    <h3>Unggah Dokumen Baru</h3>
                    <div id="drag-drop-area" class="drag-drop-area">
                        <i class="ph-bold ph-upload-simple"
                            style="font-size: 32px; color: var(--text-muted); margin-bottom: 12px;"></i>
                        <p style="color: var(--text-secondary);">Klik atau lepaskan file PDF di sini</p>
                        <input type="file" id="file-input" accept="application/pdf" hidden>
                    </div>

                    <div id="progress-compact" class="hidden"
                        style="background: #FFF; padding: 24px; border-radius: 12px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                            <span id="upload-status-text"
                                style="font-size: 14px; font-weight: 500;">Mengunggah...</span>
                        </div>
                        <div style="height: 6px; background: #E5E5E5; border-radius: 3px; overflow: hidden;">
                            <div id="progress-fill"
                                style="height: 100%; width: 0%; background: var(--accent-primary); transition: width 0.2s;">
                            </div>
                        </div>
                    </div>

                    <!-- Terminal Log Monitor -->
                    <div id="terminal-monitor" class="hidden" style="margin-top: 24px; background: #181817; color: #38BDF8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; padding: 16px; border-radius: 12px; font-size: 12px; height: 220px; overflow-y: auto; line-height: 1.6; border: 1px solid var(--border-color); box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);">
                        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.07); padding-bottom: 8px; margin-bottom: 8px; color: var(--text-muted); font-family: var(--font-family); font-weight: 500; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;">
                            <span style="display: flex; align-items: center; gap: 6px;"><i class="ph-bold ph-terminal" style="font-size: 13px;"></i> Log Pemrosesan Dokumen</span>
                            <span id="terminal-filename" style="color: var(--accent-primary);">dokumen.pdf</span>
                        </div>
                        <div id="terminal-logs-content" style="white-space: pre-wrap; font-size: 11px;">
                            <!-- Logs will be appended here -->
                        </div>
                    </div>
                </div>

                <div class="admin-card">
                    <h3>Daftar Dokumen</h3>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Nama File</th>
                                <th>Tanggal Unggah</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="document-table-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
</body>

</html>
