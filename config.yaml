# Semua hyperparameter di satu tempat untuk reproducibility

chunking:
  chunk_size: 600
  chunk_overlap: 100
  separators: ["\nBAB ", "\nPasal ", "\n(", "\n", " "]

embedding:
  model_name: "sentence-transformers/LaBSE"
  batch_size: 32

retrieval:
  bm25_top_k: 10
  vector_top_k: 10
  final_top_k: 5
  rrf_k_constant: 60
  bm25_weight: 0.4
  vector_weight: 0.6

llm:
  model: "gemini-1.5-flash"
  max_tokens: 1024
  temperature: 0.1  # Rendah untuk konsistensi dokumen hukum

evaluation:
  benchmark_size: 75
  recall_k: [1, 3, 5]

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  eval_data: "data/eval"
  chroma_db: "./chroma_db"
