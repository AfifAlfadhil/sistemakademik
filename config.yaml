ingestion:
  chunk_size: 1000
  chunk_overlap: 150
  separators: ["\n\n", "\n", ". ", " ", ""]

ocr:
  dpi: 400
  tesseract_lang: "ind"
  tesseract_psm_text: 6
  tesseract_psm_table: 11
  tesseract_psm_mixed: 3
  preprocessing:
    bilateral_d: 7
    bilateral_sigma_color: 50
    bilateral_sigma_space: 50
    adaptive_block_size: 21
    adaptive_c: 5
    deskew_threshold: 0.5
    border_crop_percent: 0.01

embedding:
  model: "gemini-embedding-2"
  dimension: 3072
  batch_size: 100
  task_type_document: "RETRIEVAL_DOCUMENT"
  task_type_query: "RETRIEVAL_QUERY"

# retrieval:
#   top_k: 5

vector_store:
  collection_name: "academic_docs"
  persist_directory: "./chroma_db"

